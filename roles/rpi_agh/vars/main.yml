---
# Fixed sshd settings required by the setup procedure (not meant to be tuned).
__rpi_agh_sshd_settings:
  LoginGraceTime: "0"
  PermitRootLogin: "no"
  PubkeyAuthentication: "yes"
  PasswordAuthentication: "no"
  PermitEmptyPasswords: "no"
  ClientAliveCountMax: "2"

# One OpenSSH public key per list item: <type> <base64> [comment]
__rpi_agh_ssh_key_regex: >-
  ^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com)
  [A-Za-z0-9+/]+={0,3}( .*)?$
