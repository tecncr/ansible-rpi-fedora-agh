---
- name: Base | set static hostname
  ansible.builtin.hostname:
    name: "{{ rpi_agh_fqdn }}"
    use: systemd

- name: Base | allow unprivileged binds from port {{ rpi_agh_unprivileged_port_start }}
  ansible.builtin.copy:
    dest: /etc/sysctl.d/50-unprivileged-port-start.conf
    content: "net.ipv4.ip_unprivileged_port_start={{ rpi_agh_unprivileged_port_start }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl

- name: Base | configure zram
  ansible.builtin.template:
    src: zram-generator.conf.j2
    dest: /etc/systemd/zram-generator.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reboot required

# Installed and enabled only: the I2C bus appears after the reboot that the
# firmware config change triggers, and the unit first runs at that boot.
- name: Base | install rtc-ds3231.service
  ansible.builtin.template:
    src: rtc-ds3231.service.j2
    dest: /etc/systemd/system/rtc-ds3231.service
    owner: root
    group: root
    mode: "0644"
  register: __rpi_agh_rtc_unit
  notify: Reboot required

- name: Base | enable rtc-ds3231.service (started by the reboot)
  ansible.builtin.systemd_service:
    name: rtc-ds3231.service
    enabled: true
    daemon_reload: "{{ __rpi_agh_rtc_unit is changed }}"

- name: Base | enable I2C and the DS3231 RTC overlay in the firmware config
  ansible.builtin.lineinfile:
    path: "{{ rpi_agh_firmware_config }}"
    line: "{{ item }}"
    state: present
  loop: "{{ rpi_agh_firmware_config_lines }}"
  notify: Reboot required
