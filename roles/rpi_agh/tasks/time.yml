---
# rtc-ds3231.service is installed and enabled in phase 1 (base.yml) and first
# runs at the phase 1 reboot. It registers the DS3231 on the bus (new_device),
# so it must be active before i2cdetect can show UU and hwclock can read it.
# A DS3231 that lost its time (oscillator stop flag: new module, flat battery)
# cannot be read until it is written, so the reads below tolerate that and the
# RTC is then written from the NTP synchronised system clock.
- name: Time | rtc-ds3231.service is running
  ansible.builtin.systemd_service:
    name: rtc-ds3231.service
    enabled: true
    state: started

- name: Time | probe the I2C bus (i2cdetect -y {{ rpi_agh_rtc_i2c_bus }})
  ansible.builtin.command: i2cdetect -y {{ rpi_agh_rtc_i2c_bus }}
  register: __rpi_agh_i2cdetect
  changed_when: false
  check_mode: false

- name: Time | DS3231 is claimed by the kernel driver (UU) at {{ rpi_agh_rtc_i2c_address }}
  vars:
    __addr: "{{ rpi_agh_rtc_i2c_address | int(base=16) }}"
    __row_label: "{{ '%02x:' | format((__addr | int) // 16 * 16) }}"
    __row: "{{ __rpi_agh_i2cdetect.stdout_lines | select('match', '^' ~ __row_label) | first | default('') }}"
    __cell: "{{ (__row.split()[1:] + [''] * 16)[(__addr | int) % 16] }}"
  ansible.builtin.assert:
    that:
      - __cell == 'UU'
    fail_msg: |
      Expected UU at {{ rpi_agh_rtc_i2c_address }} on i2c-{{ rpi_agh_rtc_i2c_bus }}, got '{{ __cell }}'.
      Is the DS3231 connected? Check `systemctl status rtc-ds3231.service`.
      {{ __rpi_agh_i2cdetect.stdout }}
    success_msg: "DS3231 found at {{ rpi_agh_rtc_i2c_address }} (UU)"

- name: Time | read the hardware clock
  ansible.builtin.command: hwclock -r --verbose
  register: __rpi_agh_hwclock_before
  changed_when: false
  failed_when: false
  check_mode: false

- name: Time | show the hardware clock
  ansible.builtin.debug:
    msg: "{{ __rpi_agh_hwclock_before.stdout_lines + __rpi_agh_hwclock_before.stderr_lines }}"

- name: Time | read NTP / RTC settings
  ansible.builtin.command: timedatectl show -p NTP -p LocalRTC
  register: __rpi_agh_timedate
  changed_when: false
  check_mode: false

- name: Time | enable NTP (timedatectl set-ntp true)
  ansible.builtin.command: timedatectl set-ntp true
  when: "'NTP=yes' not in __rpi_agh_timedate.stdout_lines"
  changed_when: true

- name: Time | keep the RTC in UTC (timedatectl set-local-rtc 0)
  ansible.builtin.command: timedatectl set-local-rtc 0
  when: "'LocalRTC=no' not in __rpi_agh_timedate.stdout_lines"
  changed_when: true

- name: Time | wait for NTP synchronisation before trusting the system clock
  ansible.builtin.command: timedatectl show -p NTPSynchronized --value
  register: __rpi_agh_ntp_sync
  until: __rpi_agh_ntp_sync.stdout == 'yes'
  retries: "{{ (rpi_agh_ntp_sync_timeout | int / 5) | round(0, 'ceil') | int }}"
  delay: 5
  changed_when: false
  check_mode: false

# Prints the absolute drift in seconds, or "unreadable" when the RTC has no valid time
- name: Time | measure RTC drift
  ansible.builtin.shell: |
    set -euo pipefail
    if ! rtc_time=$(hwclock --get); then echo unreadable; exit 0; fi
    rtc=$(date -d "$rtc_time" +%s)
    now=$(date +%s)
    d=$(( now - rtc )); echo "${d#-}"
  args:
    executable: /bin/bash
  register: __rpi_agh_rtc_drift
  changed_when: false
  check_mode: false

- name: Time | write the system time to the RTC (hwclock -w)
  ansible.builtin.command: hwclock -w --verbose
  when: >-
    __rpi_agh_rtc_drift.stdout == 'unreadable'
    or __rpi_agh_rtc_drift.stdout | int > rpi_agh_rtc_max_drift_seconds
  changed_when: true

- name: Time | read timedatectl status
  ansible.builtin.command: timedatectl
  register: __rpi_agh_timedatectl
  changed_when: false
  check_mode: false

- name: Time | show timedatectl status
  ansible.builtin.debug:
    var: __rpi_agh_timedatectl.stdout_lines
