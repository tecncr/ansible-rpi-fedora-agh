---
# Reboot at the end of phase 1 when either
#   a) a task in this run notified "Reboot required" (upgrade, zram, config.txt), or
#   b) the running system shows that a reboot is still pending, which also
#      catches changes made by an earlier run that failed before rebooting:
#        - dnf needs-restarting: updated core packages (kernel, glibc, systemd...)
#        - rtc-ds3231.service (installed in base.yml) is not active: it can
#          only start once the I2C bus from config.txt exists, i.e. after a boot
#        - zram0 is missing or not using the configured compression algorithm
# Phase 2 therefore always starts on the new kernel, with zram and the RTC up.

- name: Reboot | flush phase 1 handlers
  ansible.builtin.meta: flush_handlers

- name: Reboot | check whether updated packages need a reboot
  ansible.builtin.command: dnf needs-restarting --reboothint --cacheonly --quiet
  register: __rpi_agh_needs_restarting
  changed_when: false
  failed_when: __rpi_agh_needs_restarting.rc not in [0, 1]
  check_mode: false

- name: Reboot | check whether rtc-ds3231.service is active
  ansible.builtin.systemd_service:
    name: rtc-ds3231.service
  register: __rpi_agh_rtc_active

- name: Reboot | read the active zram compression algorithm
  ansible.builtin.slurp:
    src: /sys/block/zram0/comp_algorithm
  register: __rpi_agh_zram_algorithm
  failed_when: false

- name: Reboot | decide
  ansible.builtin.set_fact:
    __rpi_agh_reboot_reasons: >-
      {{ (['changes made in this run'] if rpi_agh_reboot_required | default(false) | bool else [])
         + (['updated packages (dnf needs-restarting)'] if __rpi_agh_needs_restarting.rc == 1 else [])
         + (['rtc-ds3231.service not active']
            if __rpi_agh_rtc_active.status.ActiveState | default('') != 'active' else [])
         + (['zram0 not using ' ~ rpi_agh_zram_compression_algorithm]
            if ('[' ~ rpi_agh_zram_compression_algorithm ~ ']')
               not in (__rpi_agh_zram_algorithm.content | default('') | b64decode)
            else []) }}

- name: Reboot | reasons
  ansible.builtin.debug:
    msg: "Rebooting because of: {{ __rpi_agh_reboot_reasons | join(', ') }}"
  when: __rpi_agh_reboot_reasons | length > 0

- name: Reboot | reboot the Pi
  ansible.builtin.reboot:
    msg: Rebooting after base setup (rpi_agh phase 1)
    reboot_timeout: "{{ rpi_agh_reboot_timeout }}"
    post_reboot_delay: 10
  when: __rpi_agh_reboot_reasons | length > 0

- name: Reboot | clear reboot flag
  ansible.builtin.set_fact:
    rpi_agh_reboot_required: false

# An inactive RTC unit or missing zram after a reboot is a configuration problem, not
# something another reboot fixes: fail here instead of rebooting on every run.
- name: Reboot | re-check the RTC unit and zram after rebooting
  when: __rpi_agh_reboot_reasons | length > 0
  block:
    - name: Reboot | rtc-ds3231.service came up at boot
      ansible.builtin.systemd_service:
        name: rtc-ds3231.service
      register: __rpi_agh_rtc_active_after
      failed_when: __rpi_agh_rtc_active_after.status.ActiveState | default('') != 'active'

    - name: Reboot | zram uses the configured algorithm now
      ansible.builtin.slurp:
        src: /sys/block/zram0/comp_algorithm
      register: __rpi_agh_zram_after
      failed_when: >-
        __rpi_agh_zram_after is failed
        or ('[' ~ rpi_agh_zram_compression_algorithm ~ ']') not in (__rpi_agh_zram_after.content | b64decode)
