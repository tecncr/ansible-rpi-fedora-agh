---
- name: Reboot required
  ansible.builtin.set_fact:
    rpi_agh_reboot_required: true

- name: Apply sysctl
  ansible.builtin.command: sysctl --load=/etc/sysctl.d/50-unprivileged-port-start.conf
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    state: reloaded

- name: Restart cockpit
  ansible.builtin.systemd_service:
    name: cockpit.socket
    state: restarted

- name: Migrate podman storage of the admin user
  ansible.builtin.command: podman system migrate
  become: true
  become_user: "{{ rpi_agh_admin_user }}"
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ rpi_agh_admin_uid }}
  changed_when: true
  failed_when: false   # the admin user may not have a running user manager

- name: Migrate podman storage of the services user
  ansible.builtin.command: podman system migrate
  become: true
  become_user: "{{ rpi_agh_services_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ rpi_agh_services_runtime_dir }}"
  changed_when: true

- name: Restart sshd
  ansible.builtin.systemd_service:
    name: sshd.service
    state: restarted
