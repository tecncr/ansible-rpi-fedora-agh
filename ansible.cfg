[defaults]
inventory = ./inventory
roles_path = ./roles
collections_path = ./collections
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
forks = 5
host_key_checking = true
# Use one of: --ask-vault-pass, --vault-password-file <file>, or the
# ANSIBLE_VAULT_PASSWORD_FILE environment variable (see docs/secrets.md).

[privilege_escalation]
become = true
become_method = ansible.builtin.sudo

[ssh_connection]
# Pipelining avoids world-readable temp files when becoming the unprivileged
# services user and makes runs much faster on a Pi.
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15
